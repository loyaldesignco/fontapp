[package]
name = "fontvault"
version = "0.1.0"
description = "FontVault — the ultimate font manager"
authors = ["Brian"]
edition = "2021"

[lib]
name = "fontvault_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.21"
walkdir = "2"

[features]
# By default Tauri runs in production mode.
# `tauri dev` enables `custom-protocol` automatically.
custom-protocol = ["tauri/custom-protocol"]
